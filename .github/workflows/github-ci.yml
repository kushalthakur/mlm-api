on: 
  push:
    branches:
      - ci-cd-Pipeline
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [14.x, 16.x]
    steps:
      - uses: actions/checkout@v2
      - name: Use Node.js ${{matrix.node-version}}
        uses: actions/setup-node@v1
        with: 
          node-version: ${{matrix.node-version}}
      - run: npm ci
      - run: npm run build
      - run: npm test
  deploy:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: docker build
        uses: actions/docker/cli@ci-cd-Pipeline
        with:
          args: build -t kushalthakur/mlm-api .
      - name: docker login
        uses: actions/docker/login@ci-cd-Pipeline
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
      - name: docker push
        uses: actions/docker/cli@ci-cd-Pipeline
        with:
          args: push kushalthakur/mlm-api